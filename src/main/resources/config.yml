# ============================================================
#  TerritoryPlugin 领地插件配置
#  轻量级区块领地：站在区块内购买即圈地，相邻区块自动合并
# ============================================================

# 启用领地系统的世界（按需求：仅主世界；把你的主世界名字写在这里）
enabled-worlds:
  - "world"

# 购买一个区块的价格
chunk-price: 2500

# 主动放弃区块（/res unclaim）的退款比例：0.5 = 退一半，0 = 不退
refund-ratio: 0.5

# 每位玩家最多可拥有的区块数量（-1 = 不限制）
max-chunks-per-player: -1

# 进阶保护模块价格（每个领地一次性买断，之后可随时开关）
module-price: 500

# 各模块单独定价（可选，未列出的模块使用 module-price 兜底）
module-prices:
  EXPLOSION: 500      # 防爆炸
  MOB_GRIEF: 500      # 防生物破坏
  PVP: 500            # 禁用PvP
  FIRE: 500           # 防火焰蔓延
  MOB_SPAWN: 500      # 禁止刷怪
  LIGHTNING: 500      # 防雷击
  ANIMAL_GRIEF: 500   # 防动物破坏
  NO_PICKUP: 500      # 禁访客拾取
  NO_DROP: 500        # 禁访客丢弃
  NO_TELEPORT: 500    # 禁访客传送
  LEAF_DECAY: 500     # 防树叶腐烂

# 进出领地聊天提示
entry-exit-messages: true

# /res view 边界粒子渲染
view-particle-seconds: 30
view-radius-chunks: 2

# 交互链接：用领地外的按钮/拉杆远程控制领地内的门、活板门、栅栏门
# 源方块必须在荒野或自己的领地内；目标方块必须在自己的领地内
link:
  enabled: true
  # 每个领地最多几条链接（-1 = 不限制）
  max-per-territory: 8
  # 新建链接的默认模式：TRUSTED（仅领主/白名单）或 PUBLIC（任何未被拉黑的玩家）
  default-mode: TRUSTED
  # 按钮触发的默认自动关门秒数（0 = 不自动关，按钮改为开/关切换）；拉杆不使用自动关门
  default-auto-close-seconds: 5
  # 同一玩家同一链接的触发冷却（毫秒）
  cooldown-ms: 500
  # 源方块到目标方块的最大距离（0 = 不限制）
  max-distance: 0

# 异步自动保存间隔（秒）。修改数据后约在此间隔后写盘，关服时强制保存
autosave-seconds: 5

# ------------------------------------------------------------
# 超级管理员（可越权管理任何领地）
# 注意：OP 本身【不会】越权！必须把 UUID 手动加到下面才会生效。
# 游戏内可用 /res admin whoami 查询自己的 UUID，控制台始终拥有全部管理权限。
# 也可以不用本名单：用 LuckPerms 等权限插件授予 territory.admin 权限节点即可（与名单取并集）。
# 示例：
# superadmins:
#   - "069a79f4-44e9-4726-a5be-fca90e38aaf5"
superadmins: []

# 超级管理员是否也无视领地保护（拆/放方块等）
# 注意：LuckPerms 的 territory.bypass 权限节点不受此开关影响（显式授予即生效，慎用）
superadmin-bypass-protection: true

